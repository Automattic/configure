[package]
name = "a8c-secrets"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "a8c-secrets"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha1 = "0.10"
git2 = "0.19"
anyhow = "1.0"

[lints.clippy]
# Enable additional lint groups for better code quality (lower priority so specific lints can override)
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Specific lints we want to be errors (not just warnings)
uninlined_format_args = "deny"
manual_let_else = "deny"  
redundant_closure_for_method_calls = "deny"
cloned_instead_of_copied = "deny"
unnecessary_wraps = "deny"

# Pedantic lints that can be too noisy - downgrade to allow
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"  # Too picky about URL formatting

# Cargo lints that are too noisy for this project
cargo_common_metadata = "allow"  # We don't need full package metadata for internal tools

# Nursery lints that might be too experimental
option_if_let_else = "allow"